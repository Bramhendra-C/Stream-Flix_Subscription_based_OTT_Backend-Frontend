<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — StreamFlix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="site-header"></div>

<main class="narrow">
  <div class="auth-card">
    <h1 class="display">Log in</h1>
    <p class="auth-sub">Welcome back to StreamFlix.</p>

    <form id="loginForm">
      <div class="field">
        <label>Email</label>
        <input type="email" id="email" required />
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="password" required />
      </div>
      <button type="submit" class="btn btn-gold" style="width:100%;">Log in</button>
    </form>

    <div class="auth-switch">No account yet? <a href="register.html">Register</a></div>
  </div>
</main>

<footer id="site-footer"></footer>

<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script src="js/login.js"></script>
</body>
</html>
